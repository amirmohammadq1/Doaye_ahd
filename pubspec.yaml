name: doaye_ahd
description: "دعای عهد - متن، ترجمه و صوت دعای عهد"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_native_splash: ^2.4.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/splash.png
    - assets/audio/farahmand.mp3
    - assets/audio/mirdamad.mp3
    - assets/audio/meysam_kazem.mp3
    - assets/audio/asadi.mp3

  # فونت اختصاصی برای نمایش متن عربی دعا به‌سبک قرآنی.
  # فایل فونت را خودتان باید در مسیر assets/fonts/QuranFont.ttf قرار دهید
  # (مثلاً فونت رایگان و آزاد «Amiri Quran» یا «Scheherazade New»).
  fonts:
    - family: QuranFont
      fonts:
        - asset: assets/fonts/QuranFont.ttf

# تنظیمات اسپلش‌اسکرین بومی (فقط برای لحظه‌ی خیلی اول قبل از رندر فلاتر)
flutter_native_splash:
  color: "#0B0B0B"
  image: assets/logo.png
  android_12:
    image: assets/logo.png
    icon_background_color: "#0B0B0B"
    color: "#0B0B0B"
  android: true
  ios: false
  web: false

# تنظیمات آیکون برنامه
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
