name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# هر معماری پردازنده در یک job جدا و با نسخه‌ی خودش ساخته می‌شود (مثل پروژه‌ی سوره صافات).
# نسخه‌ها همین‌جا تنظیم می‌شوند؛ version_code باید همیشه از نسخه‌ی قبلیِ منتشرشده بزرگ‌تر باشد.
jobs:
  build:
    name: Build APK (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # گوشی‌های معمولی: armeabi-v7a (قدیمی) + arm64-v8a (جدید)
          - name: arm
            platforms: android-arm,android-arm64
            abis: armeabi-v7a,arm64-v8a
            want: "armeabi-v7a arm64-v8a"
            forbid: "x86 x86_64"
            version_name: "2.0.0"
            version_code: "2000"
            apk_name: DoayeAhd-v2.0.0-ARM.apk
          # شبیه‌ساز و دستگاه‌های اینتلی (فلاتر در حالت release فقط x86_64 را پشتیبانی می‌کند، نه x86 ۳۲‌بیتی)
          - name: x86_64
            platforms: android-x64
            abis: x86_64
            want: "x86_64"
            forbid: "armeabi-v7a arm64-v8a x86"
            version_name: "2.0.1"
            version_code: "2001"
            apk_name: DoayeAhd-v2.0.1-x86_64.apk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare icon sources (logo.webp to PNG)
        run: |
          python3 -m venv /tmp/iconvenv
          /tmp/iconvenv/bin/pip install --quiet pillow
          /tmp/iconvenv/bin/python tools/prepare_icons.py

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Generate launcher icon
        run: dart run flutter_launcher_icons

      - name: Setup Gradle wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Create gradlew wrapper files
        working-directory: android
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      # ---- امضای برنامه برای انتشار در مایکت ----
      # این مرحله فقط زمانی کاری انجام می‌دهد که سکرت‌های زیر در گیت‌هاب تنظیم شده باشند:
      # KEYSTORE_BASE64 , KEYSTORE_PASSWORD , KEY_ALIAS , KEY_PASSWORD
      - name: Setup signing (if secrets are configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
            {
              printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
              printf 'keyPassword=%s\n' "$KEY_PASSWORD"
              printf 'keyAlias=%s\n' "$KEY_ALIAS"
              printf 'storeFile=keystore.jks\n'
            } > android/key.properties
            echo "Signing configured."
          else
            echo "No signing secrets found, building with debug key."
          fi

      # کتابخانه‌های بومیِ بعضی پلاگین‌ها (مثل shared_preferences) برای همه‌ی معماری‌ها در AAR هستند
      # و --target-platform جلویشان را نمی‌گیرد. این فیلتر فقط معماری‌های همین APK را نگه می‌دارد.
      - name: Keep only this APK's CPU architectures (${{ matrix.name }})
        run: printf '\napkAbis=%s\n' "${{ matrix.abis }}" >> android/gradle.properties

      - name: Build release APK (${{ matrix.name }})
        run: >
          flutter build apk --release
          --target-platform ${{ matrix.platforms }}
          --build-name=${{ matrix.version_name }}
          --build-number=${{ matrix.version_code }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${{ matrix.apk_name }}"

      - name: Verify APK (CPU architectures, package, version, signature)
        env:
          APK: dist/${{ matrix.apk_name }}
          VNAME: ${{ matrix.version_name }}
          VCODE: ${{ matrix.version_code }}
          WANT: ${{ matrix.want }}
          FORBID: ${{ matrix.forbid }}
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          abis=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u | tr '\n' ' ')
          echo "ABIs: $abis"
          for a in $WANT; do
            echo "$abis" | grep -q "lib/$a/" || { echo "::error::missing ABI $a"; exit 1; }
          done
          for a in $FORBID; do
            if echo "$abis" | grep -q "lib/$a/"; then echo "::error::unexpected ABI $a in this APK"; exit 1; fi
          done
          "$BT/aapt" dump badging "$APK" | grep -E "^package:" | tee /tmp/badging.txt
          grep -q "name='ir.doayeahd.app'" /tmp/badging.txt || { echo "::error::wrong package name"; exit 1; }
          grep -q "versionName='$VNAME'" /tmp/badging.txt || { echo "::error::wrong versionName (expected $VNAME)"; exit 1; }
          grep -q "versionCode='$VCODE'" /tmp/badging.txt || { echo "::error::wrong versionCode (expected $VCODE)"; exit 1; }
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/cert.txt | grep -E "Verifies|SHA-256 digest" || true
          grep -q "Verifies" /tmp/cert.txt || { echo "::error::signature check failed"; exit 1; }
          if grep -qi "Android Debug" /tmp/cert.txt; then
            echo "::warning::APK is signed with the DEBUG key (signing secrets are missing) - not suitable for Myket"
          fi
          {
            echo "### ${{ matrix.apk_name }}"
            echo "- size: $(du -h "$APK" | cut -f1)"
            echo "- ABIs: $abis"
            echo "- version: $VNAME ($VCODE)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: doaye-ahd-${{ matrix.name }}-apk
          path: dist/${{ matrix.apk_name }}
